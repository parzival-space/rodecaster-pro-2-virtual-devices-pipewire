# create virtual channel devices
context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.system"
            node.description = "RODECaster PRO II System"
            audio.position = [ FL FR ]
            
            capture.props = {
                media.class = "Audio/Sink"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.system"
            }
                
            playback.props = {
                target.object = "alsa_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-output-1"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.output.system"
                stream.dont-remix = "true"
                audio.position = [ AUX0 AUX1 ]
            }
        }
    },
    {
        name = libpipewire-module-loopback
        args = {
            node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.game"
            node.description = "RODECaster PRO II Game"
            audio.position = [ FL FR ]
            
            capture.props = {
                media.class = "Audio/Sink"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.game"
            }
            
            playback.props = {
                target.object = "alsa_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-output-1"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.output.game"
                stream.dont-remix = "true"
                audio.position = [ AUX2 AUX3 ]
            }
        }
    },
    {
        name = libpipewire-module-loopback
        args = {
            node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.music"
            node.description = "RODECaster PRO II Music"
            audio.position = [ FL FR ]
            
            capture.props = {
                media.class = "Audio/Sink"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.music"
            }
            
            playback.props = {
                target.object = "alsa_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-output-1"
                node.name = "virtual_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.output.music"
                stream.dont-remix = "true"
                audio.position = [ AUX4 AUX5 ]
            }
        }
    }
]

# assign correct names to physical devices
node.rules = [
    # output
    {
        matches = [
            {
                node.name = "alsa_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-output-1"
            }
        ]
        actions = {
            update-props = {
                node.description = "RODECaster Pro II Multi-Channel"
                node.nick = "RODECaster Pro II Multi-Channel"
            }
        }
    },
    {
        matches = [
            {
                node.name = "alsa_output.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-output-0"
            }
        ]
        actions = {
            update-props = {
                node.description = "RODECaster Pro II Chat"
                node.nick = "RODECaster Pro II Chat"
            }
        }
    },
    # input
    {
        matches = [
            {
                node.name = "alsa_input.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-input-1"
            }
        ]
        actions = {
            update-props = {
                node.description = "RODECaster Pro II Multi-Channel"
                node.nick = "RODECaster Pro II Multi-Channel"
            }
        }
    },
    {
        matches = [
            {
                node.name = "alsa_input.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-input-0"
            }
        ]
        actions = {
            update-props = {
                node.description = "RODECaster Pro II Chat"
                node.nick = "RODECaster Pro II Chat"
            }
        }
    },
]
