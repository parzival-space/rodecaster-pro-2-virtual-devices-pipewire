            node.name = "virtual_input.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.main"
            node.description = "RODECaster Pro II Main Mix"
            audio.position = [ FL FR ]

            capture.props = {
                target.object = "alsa_input.usb-R__DE_RODECaster_Pro_II_{{DEVICE_SERIAL}}.pro-input-1"
                audio.position = [ AUX0 AUX1 ]
